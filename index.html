<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Nuxes</title>
    <link rel="stylesheet" href="responsive.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020202, #0f2f24);
        color: #00ff99;
        padding: 20px;
      }

      .card {
        width: min(460px, 94vw);
        padding: 28px;
        border-radius: 18px;
        background: rgba(10, 10, 10, 0.92);
        border: 1px solid rgba(0, 255, 153, 0.3);
        box-shadow: 0 0 24px rgba(0, 255, 153, 0.2);
      }

      h1 {
        margin-bottom: 8px;
        font-size: 24px;
      }

      p {
        margin-bottom: 20px;
        color: #7dffd1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cyber Nuxes</h1>
      <p>Welcome to Cyber Nuxes!</p>
      <p>Please press Next to proceed to the authentication page.</p>
      <p>We hope to have a wonderful time with you!</p>
      <a href="login.html">Next</a>
    </div>
  </body>
</html>
