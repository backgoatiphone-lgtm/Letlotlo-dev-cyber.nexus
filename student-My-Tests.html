<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Tests</title>
    <link rel="stylesheet" href="responsive.css" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #020202, #0f2f24); color: #00ff99; min-height: 100vh; }
      .page { display: flex; min-height: 100vh; }
      .sidebar { width: 240px; background: rgba(8, 8, 8, 0.95); border-right: 1px solid rgba(0,255,153,0.3); padding: 24px 16px; }
      .sidebar h2 { font-size: 20px; margin-bottom: 16px; }
      .sidebar a { display: block; color: #7dffd1; text-decoration: none; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid transparent; }
      .sidebar a:hover, .sidebar a.active { background: rgba(0,255,153,0.12); border-color: rgba(0,255,153,0.3); color: #00ff99; }
      .content { flex: 1; padding: 24px; }
      .container { max-width: 1100px; margin: 0 auto; background: rgba(10,10,10,0.92); border: 1px solid rgba(0,255,153,0.3); border-radius: 20px; padding: 24px; box-shadow: 0 0 24px rgba(0,255,153,0.2); }
      h1 { font-size: 28px; margin-bottom: 8px; }
      p { color: #7dffd1; margin-bottom: 20px; }
      .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,153,0.2); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
      .card h3 { margin-bottom: 6px; }
      .meta { color: #7dffd1; font-size: 13px; margin-bottom: 8px; }
      .options { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
      .options label { color: #caffef; display: flex; gap: 8px; align-items: center; }
      .empty-state { color: #7dffd1; }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <h2>Cyber Nuxes</h2>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="student-learning.html">My Lessons</a>
        <a href="student-My-Tests.html" class="active">My Tests</a>
        <a href="student-My-Exams.html">My Exams</a>
        <a href="student-My-Results.html">My Results</a>
        <a href="student-My-Certificates.html">My Certificates</a>
        <a href="login.html">Logout</a>
      </aside>
      <div class="content">
        <div class="container">
          <h1>My Tests</h1>
          <p>View the tests assigned to you and review the available options.</p>
          <div id="testList"></div>
        </div>
      </div>
    </div>
    <script>
      const storedCourses = JSON.parse(localStorage.getItem("cyberNuxesCourses") || "[]");
      const tests = storedCourses.flatMap((course) => (course.tests || []).map((test) => ({ courseTitle: course.title, ...test })));
      const container = document.getElementById("testList");
      if (!tests.length) {
        container.innerHTML = '<div class="empty-state">No tests have been posted yet.</div>';
      } else {
        container.innerHTML = tests.map((test) => `
          <div class="card">
            <h3>${test.title}</h3>
            <div class="meta">Course: ${test.courseTitle}</div>
            <p>${test.question || "No question provided."}</p>
            <div class="options">
              ${(test.options || []).map((option) => `<label><input type="radio" name="${test.title}" /> ${option}</label>`).join("")}
            </div>
          </div>
        `).join("");
      }
    </script>
  </body>
</html>
