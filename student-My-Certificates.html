<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Certificates</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #020202, #0f2f24); color: #00ff99; min-height: 100vh; }
      .page { display: flex; min-height: 100vh; }
      .sidebar { width: 240px; background: rgba(8, 8, 8, 0.95); border-right: 1px solid rgba(0,255,153,0.3); padding: 24px 16px; }
      .sidebar h2 { font-size: 20px; margin-bottom: 16px; }
      .sidebar a { display: block; color: #7dffd1; text-decoration: none; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid transparent; }
      .sidebar a:hover, .sidebar a.active { background: rgba(0,255,153,0.12); border-color: rgba(0,255,153,0.3); color: #00ff99; }
      .content { flex: 1; padding: 24px; }
      .container { max-width: 1100px; margin: 0 auto; background: rgba(10,10,10,0.92); border: 1px solid rgba(0,255,153,0.3); border-radius: 20px; padding: 24px; box-shadow: 0 0 24px rgba(0,255,153,0.2); }
      h1 { font-size: 28px; margin-bottom: 8px; }
      p { color: #7dffd1; margin-bottom: 20px; }
      .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,153,0.2); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .download-btn { padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(0,255,153,0.35); background: transparent; color: #00ff99; cursor: pointer; }
      .download-btn:hover { background: rgba(0,255,153,0.14); }
      .empty-state { color: #7dffd1; }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <h2>Cyber Nuxes</h2>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="student-learning.html">My Lessons</a>
        <a href="student-My-Tests.html">My Tests</a>
        <a href="student-My-Exams.html">My Exams</a>
        <a href="student-My-Results.html">My Results</a>
        <a href="student-My-Certificates.html" class="active">My Certificates</a>
        <a href="login.html">Logout</a>
      </aside>
      <div class="content">
        <div class="container">
          <h1>My Certificates</h1>
          <p>Certificates will appear once your course milestones are completed.</p>
          <div id="certificateList"></div>
        </div>
      </div>
    </div>
    <script>
      const storedCourses = JSON.parse(localStorage.getItem("cyberNuxesCourses") || "[]");
      const certificates = storedCourses.length ? storedCourses.slice(0, 2).map((course) => ({ title: `${course.title} Completion Certificate`, courseTitle: course.title })) : [];
      const container = document.getElementById("certificateList");

      function downloadCertificate(title, courseTitle) {
        const studentName = localStorage.getItem("currentStudentName") || "Student";
        const safeFileName = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "certificate";
        const certificateHtml = `<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${title}</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #07140f, #0f2d22);
        color: #0f2d22;
      }
      .certificate {
        width: 900px;
        max-width: 95vw;
        padding: 48px 56px;
        border: 10px solid #c8a96b;
        border-radius: 24px;
        background: linear-gradient(135deg, #fffdfa 0%, #f7efdf 100%);
        box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        text-align: center;
      }
      .header {
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #8a5d1f;
        font-size: 14px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 36px;
        margin: 0 0 14px;
        color: #173b2d;
      }
      .subtitle {
        font-size: 18px;
        color: #4b4b4b;
        margin-bottom: 24px;
      }
      .name {
        font-size: 34px;
        font-weight: 700;
        color: #173b2d;
        margin: 18px 0 8px;
        border-bottom: 2px solid #c8a96b;
        display: inline-block;
        padding-bottom: 6px;
      }
      .description {
        font-size: 18px;
        line-height: 1.7;
        color: #3d3d3d;
        margin: 16px 0;
      }
      .course {
        font-size: 22px;
        font-weight: 700;
        color: #173b2d;
        margin: 8px 0 24px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 34px;
        border-top: 1px solid #d8c6a0;
        padding-top: 18px;
        font-size: 14px;
        color: #6d5b3b;
      }
      .seal {
        width: 110px;
        height: 110px;
        border: 3px solid #c8a96b;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #8a5d1f;
      }
    </style>
  </head>
  <body>
    <div class="certificate">
      <div class="header">Cyber Nuxes Academy</div>
      <h1>Certificate of Completion</h1>
      <div class="subtitle">This certifies that</div>
      <div class="name">${studentName}</div>
      <div class="description">has successfully completed the required coursework and demonstrated proficiency in</div>
      <div class="course">${courseTitle}</div>
      <div class="description">Issued on <strong>${new Date().toLocaleDateString()}</strong></div>
      <div class="footer">
        <div>Signed by<br /><strong>Cyber Nuxes Academy</strong></div>
        <div class="seal">CN</div>
      </div>
    </div>
  </body>
</html>`;

        const blob = new Blob([certificateHtml], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${safeFileName}.html`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      window.downloadCertificate = downloadCertificate;

      if (!certificates.length) {
        container.innerHTML = '<div class="empty-state">No certificates available yet.</div>';
      } else {
        container.innerHTML = certificates.map((certificate) => `
          <div class="card">
            <h3>${certificate.title}</h3>
            <p>Issued for successful completion of ${certificate.courseTitle}.</p>
            <div class="actions">
              <button class="download-btn" type="button" onclick="downloadCertificate('${certificate.title.replace(/'/g, "\\'")}', '${certificate.courseTitle.replace(/'/g, "\\'")}')">Download Certificate</button>
            </div>
          </div>
        `).join("");
      }
    </script>
  </body>
</html>
